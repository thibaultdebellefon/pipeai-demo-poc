<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0f1e">
  <title>PipeAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0a0f1e;
      --surface:      #111827;
      --border:       #1f2937;
      --accent:       #f97316;
      --accent-dark:  #c2410c;
      --text:         #f1f5f9;
      --muted:        #94a3b8;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top))
               max(24px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom))
               max(24px, env(safe-area-inset-left));
    }

    .state { display: none; flex-direction: column; align-items: center; gap: 20px; width: 100%; max-width: 480px; }
    .state.active { display: flex; }

    #state-result { overflow-y: auto; max-height: 100dvh; }

    .hidden { display: none; }

    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
    .subtitle { font-size: 0.9rem; color: var(--muted); text-align: center; line-height: 1.5; }

    .btn {
      width: 100%; min-height: 56px; padding: 18px;
      border: none; border-radius: 16px;
      font-size: 1rem; font-weight: 600;
      cursor: pointer; touch-action: manipulation;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:active { opacity: 0.75; }
    .btn-primary   { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-danger    { background: #ef4444; color: white; }
    .btn-secondary { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }

    #timer { font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; color: #ef4444; }

    #preview {
      width: 100%; max-height: 280px; aspect-ratio: 16 / 9;
      border-radius: 12px; object-fit: cover; background: #000;
    }

    .spinner {
      width: 48px; height: 48px;
      border: 4px solid var(--surface); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .card {
      width: 100%; background: var(--surface);
      border-radius: 12px; padding: 16px; border: 1px solid var(--border);
    }
    .card-label {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px;
    }
    .card-value { font-size: 0.95rem; line-height: 1.6; }

    .step-row { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--bg); }
    .step-row:last-child { border-bottom: none; }
    .step-num { font-weight: 700; color: var(--accent); min-width: 20px; }
    .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .tool-tag {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 3px 8px; font-size: 0.75rem; color: var(--muted);
    }
    .warning-tag { background: #7c2d12; border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; color: #fca5a5; margin-bottom: 8px; }

    .confidence-banner { width: 100%; padding: 12px; border-radius: 10px; font-size: 0.85rem; font-weight: 500; text-align: center; }
    .confidence-low  { background: #422006; color: #fbbf24; border: 1px solid #92400e; }
    .confidence-high { background: #052e16; color: #4ade80; border: 1px solid #166534; }

    .error-box { background: #1c0a0a; border: 1px solid #7f1d1d; border-radius: 12px; padding: 20px; text-align: center; }
    #error-message { color: #fca5a5; font-size: 0.95rem; line-height: 1.5; }

    @media (max-width: 400px) {
      #timer { font-size: 2.5rem; }
      .btn   { font-size: 0.95rem; padding: 16px; }
    }

    /* ── Voice conversation ── */
    .voice-panel {
      width: 100%; background: var(--surface);
      border: 1px solid var(--border); border-radius: 16px;
      padding: 20px; display: flex; flex-direction: column;
      align-items: center; gap: 12px; text-align: center;
    }
    .voice-dot {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--muted); transition: background 0.3s;
    }
    .voice-dot.listening  { background: #4ade80; animation: vpulse 1.4s ease-in-out infinite; }
    .voice-dot.speaking   { background: var(--accent); animation: vpulse 0.7s ease-in-out infinite; }
    @keyframes vpulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.5); }
    }
    .voice-label { font-size: 0.9rem; color: var(--muted); }
    .btn-talk { background: #1d4ed8; color: white; }
    .btn-talk:hover { background: #1e40af; }
  </style>
</head>
<body style="visibility:hidden">

  <!-- STATE: ready -->
  <div id="state-ready" class="state active">
    <h1>PipeAI</h1>
    <p class="subtitle">Point your camera at the problem.<br>Describe what you're seeing out loud while recording.</p>
    <p class="subtitle" style="font-size:0.8rem;">AI will diagnose it in under 60 seconds.</p>
    <button id="btn-record" class="btn btn-primary">Start recording →</button>
  </div>

  <!-- STATE: recording -->
  <div id="state-recording" class="state">
    <div id="timer">0:00</div>
    <video id="preview" autoplay muted playsinline></video>
    <button id="btn-stop" class="btn btn-danger">Stop &amp; Analyse</button>
  </div>

  <!-- STATE: processing -->
  <div id="state-processing" class="state">
    <div class="spinner"></div>
    <p class="subtitle">Analysing...<br>~30 seconds</p>
  </div>

  <!-- STATE: result -->
  <div id="state-result" class="state">
    <div id="confidence-banner" class="confidence-banner hidden"></div>
    <div class="card">
      <div class="card-label">Diagnosis</div>
      <div id="result-diagnosis" class="card-value"></div>
    </div>
    <div class="card">
      <div class="card-label">Likely cause</div>
      <div id="result-cause" class="card-value"></div>
    </div>
    <div class="card">
      <div class="card-label">Action plan</div>
      <div id="result-steps"></div>
    </div>
    <div id="result-warnings-wrap" class="card hidden">
      <div class="card-label">Safety warnings</div>
      <div id="result-warnings"></div>
    </div>
    <div id="result-notes-wrap" class="card hidden">
      <div class="card-label">Notes</div>
      <div id="result-notes" class="card-value"></div>
    </div>
    <button id="btn-mute" class="btn btn-secondary hidden">Stop speaking</button>
    <div id="voice-panel" class="voice-panel hidden">
      <audio id="voice-audio" autoplay style="display:none"></audio>
      <div id="voice-dot" class="voice-dot"></div>
      <div id="voice-label" class="voice-label">Connecting...</div>
      <button id="btn-end-call" class="btn btn-danger">End conversation</button>
    </div>
    <button id="btn-talk" class="btn btn-talk">Talk with AI plumber →</button>
    <button id="btn-restart" class="btn btn-secondary">New video</button>
    <a href="account.html" class="btn btn-secondary" style="text-align:center;text-decoration:none;">Go to profile →</a>
  </div>

  <!-- STATE: error -->
  <div id="state-error" class="state">
    <div class="error-box">
      <div id="error-message"></div>
    </div>
    <button id="btn-retry" class="btn btn-primary">Try again</button>
  </div>

  <script>
    // ── Auth guard ────────────────────────────────────────────────
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    let _userId = null;
    (async () => {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      _userId = session.user.id;
      document.body.style.visibility = 'visible';
    })();

    // ── State machine ──────────────────────────────────────────────
    const STATES = ['ready','recording','processing','result','error'];

    function setState(name) {
      STATES.forEach(s =>
        document.getElementById('state-' + s).classList.toggle('active', s === name)
      );
    }

    // ── Navigation ─────────────────────────────────────────────────
    document.getElementById('btn-restart').addEventListener('click', () => { stopSpeaking(); endVoiceSession(); setState('ready'); });
    document.getElementById('btn-retry').addEventListener('click',   () => setState('ready'));
    document.getElementById('btn-record').addEventListener('click',  startRecording);
    document.getElementById('btn-stop').addEventListener('click',    stopRecording);

    // ── Video & Media ─────────────────────────────────────────────────
    let mediaStream     = null;
    let mediaRecorder   = null;
    let videoChunks     = [];
    let extractedFrames = []; // array of raw base64 JPEG strings (no data-URI prefix)
    let timerInterval   = null;
    let recordingStart  = null;
    let transcript      = '';
    let lastResult      = null;
    let voicePc         = null;
    let voiceMicStream  = null;

    async function startRecording() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });
        document.getElementById('preview').srcObject = mediaStream;
        setState('recording');
        beginCapture();
      } catch (err) {
        showError(
          err.name === 'NotAllowedError'
            ? 'Camera and microphone access required. Please allow access in your browser settings, then tap Try again.'
            : 'Could not access camera: ' + err.message
        );
      }
    }

    function showError(msg) {
      document.getElementById('error-message').textContent = msg;
      setState('error');
    }

    function beginCapture() {
      videoChunks     = [];
      extractedFrames = [];
      transcript      = '';

      // MediaRecorder for the video blob
      const mimeType = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
      mediaRecorder = new MediaRecorder(mediaStream, { mimeType });
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) videoChunks.push(e.data); };

      // Speech recognition (Chrome / Android; gracefully absent elsewhere)
      const SpeechRecognitionClass = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognitionClass) {
        const recogniser = new SpeechRecognitionClass();
        recogniser.continuous     = true;
        recogniser.interimResults = false;
        recogniser.lang           = 'en-US';
        recogniser.onresult = e => {
          for (let i = e.resultIndex; i < e.results.length; i++) {
            if (e.results[i].isFinal) transcript += e.results[i][0].transcript + ' ';
          }
        };
        recogniser.onerror = e => console.warn('Speech recognition error:', e.error);
        recogniser.start();
        mediaRecorder._recogniser = recogniser;
      }

      // Timer
      recordingStart = Date.now();
      timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - recordingStart) / 1000);
        const m = Math.floor(elapsed / 60);
        const s = String(elapsed % 60).padStart(2, '0');
        document.getElementById('timer').textContent = m + ':' + s;
      }, 500);

      // Frame extraction: 1 frame per 5 seconds, max 3 frames
      const video  = document.getElementById('preview');
      const canvas = document.createElement('canvas');
      const ctx    = canvas.getContext('2d');

      function extractFrame() {
        if (extractedFrames.length >= 3) return;
        const vw = video.videoWidth  || 1280;
        const vh = video.videoHeight || 720;
        // Resize so longest dimension does not exceed 1280px
        const scale   = Math.min(1, 1280 / Math.max(vw, vh));
        canvas.width  = Math.round(vw * scale);
        canvas.height = Math.round(vh * scale);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        // Strip "data:image/jpeg;base64," — API needs raw base64
        extractedFrames.push(dataUrl.slice(dataUrl.indexOf(',') + 1));
        console.log('Frame', extractedFrames.length, '~', Math.round(dataUrl.length * 0.75 / 1024), 'KB');
      }

      setTimeout(extractFrame, 500); // first frame immediately
      const frameInterval = setInterval(() => {
        if (extractedFrames.length < 3) extractFrame(); else clearInterval(frameInterval);
      }, 5000);

      mediaRecorder.start(1000);
      mediaRecorder._frameInterval = frameInterval;
    }

    // ── Recording control ──────────────────────────────────────────
    function stopRecording() {
      clearInterval(timerInterval);
      clearInterval(mediaRecorder._frameInterval);
      if (mediaRecorder._recogniser) mediaRecorder._recogniser.stop();

      mediaRecorder.onstop = () => {
        mediaStream.getTracks().forEach(t => t.stop());
        setState('processing');
        analyseRecording();
      };
      mediaRecorder.stop();
    }

    async function analyseRecording() {
      // Guard: abort if no frames were captured
      if (extractedFrames.length === 0) {
        showError('No frames captured. Try a longer recording.');
        return;
      }

      // 60-second timeout
      const controller = new AbortController();
      const timeoutId  = setTimeout(() => {
        controller.abort();
        showError('This is taking longer than expected. Try again with a shorter recording.');
      }, 60000);

      try {
        const res = await fetch('/api/diagnose', {
          method: 'POST',
          signal: controller.signal,
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ frames: extractedFrames, transcript: transcript.trim() })
        });

        clearTimeout(timeoutId);

        if (res.status === 401) { showError('API configuration error. Please contact support.'); return; }
        if (res.status === 529) { showError('AI service is overloaded right now. Wait a few seconds and try again.'); return; }
        if (!res.ok)            { showError('Analysis failed (HTTP ' + res.status + '). Check your connection and try again.'); return; }

        const data = await res.json();
        const raw  = data.content?.[0]?.text ?? '';

        let result;
        try { result = JSON.parse(raw); }
        catch { showError('Could not parse AI response. Try again.'); console.error('Raw response:', raw); return; }

        renderResult(result);
        saveDiagnosis(result, extractedFrames[0]);

      } catch (err) {
        clearTimeout(timeoutId);
        if (err.name !== 'AbortError') {
          showError('Analysis failed. Check your connection and try again.');
          console.error(err);
        }
      }
    }

    function renderResult(r) {
      // Confidence banner
      const banner = document.getElementById('confidence-banner');
      if (r.confidence === 'low') {
        banner.textContent = 'Low confidence — footage may be too dark or unclear. Try again with better lighting.';
        banner.classList.remove('confidence-high', 'hidden');
        banner.classList.add('confidence-low');
      } else if (r.confidence === 'high') {
        banner.textContent = 'High confidence diagnosis';
        banner.classList.remove('confidence-low', 'hidden');
        banner.classList.add('confidence-high');
      } else {
        banner.classList.remove('confidence-low', 'confidence-high');
        banner.classList.add('hidden');
      }

      // Diagnosis + cause — safe textContent only
      document.getElementById('result-diagnosis').textContent = r.diagnosis    ?? '—';
      document.getElementById('result-cause').textContent     = r.likely_cause ?? '—';

      // Action plan — built with DOM methods, no innerHTML
      const stepsEl = document.getElementById('result-steps');
      stepsEl.replaceChildren();
      (r.action_plan ?? []).slice(0, 5).forEach(item => {
        const row = document.createElement('div');
        row.className = 'step-row';

        const num = document.createElement('span');
        num.className   = 'step-num';
        num.textContent = String(item.step);
        row.appendChild(num);

        const body = document.createElement('div');
        body.style.flex = '1';

        const action = document.createElement('div');
        action.textContent = item.action;
        body.appendChild(action);

        if (item.tools_required?.length > 0) {
          const tools = document.createElement('div');
          tools.className = 'tools';
          item.tools_required.forEach(t => {
            const tag = document.createElement('span');
            tag.className   = 'tool-tag';
            tag.textContent = t;
            tools.appendChild(tag);
          });
          body.appendChild(tools);
        }

        row.appendChild(body);
        stepsEl.appendChild(row);
      });

      // Safety warnings
      const warningsWrap = document.getElementById('result-warnings-wrap');
      const warnings     = r.safety_warnings ?? [];
      if (warnings.length > 0) {
        const warningsEl = document.getElementById('result-warnings');
        warningsEl.replaceChildren();
        warnings.forEach(w => {
          const tag = document.createElement('div');
          tag.className   = 'warning-tag';
          tag.textContent = '\u26a0 ' + w;
          warningsEl.appendChild(tag);
        });
        warningsWrap.classList.remove('hidden');
      } else {
        warningsWrap.classList.add('hidden');
      }

      // Notes
      const notesWrap = document.getElementById('result-notes-wrap');
      if (r.notes?.trim()) {
        document.getElementById('result-notes').textContent = r.notes;
        notesWrap.classList.remove('hidden');
      } else {
        notesWrap.classList.add('hidden');
      }

      lastResult = r;
      setState('result');
      speakResult(r);
    }

    // ── Text-to-speech ─────────────────────────────────────────────
    function speakResult(r) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel(); // clear any leftover utterance

      const steps = (r.action_plan ?? []).slice(0, 5)
        .map(s => 'Step ' + s.step + ': ' + s.action)
        .join('. ');

      const warnings = (r.safety_warnings ?? []).length > 0
        ? ' Safety warning: ' + r.safety_warnings.join('. ')
        : '';

      const text =
        r.diagnosis + '. ' +
        'The likely cause is: ' + r.likely_cause + '. ' +
        'Here is your action plan. ' + steps + '.' +
        warnings;

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang  = 'en-US';
      utter.rate  = 0.95;

      const muteBtn = document.getElementById('btn-mute');
      muteBtn.classList.remove('hidden');

      utter.onend = () => muteBtn.classList.add('hidden');
      utter.onerror = () => muteBtn.classList.add('hidden');

      window.speechSynthesis.speak(utter);
    }

    function stopSpeaking() {
      window.speechSynthesis?.cancel();
      document.getElementById('btn-mute').classList.add('hidden');
    }

    document.getElementById('btn-mute').addEventListener('click', stopSpeaking);
    document.getElementById('btn-talk').addEventListener('click', () => { if (lastResult) startVoiceSession(lastResult); });
    document.getElementById('btn-end-call').addEventListener('click', endVoiceSession);

    // ── Voice conversation (OpenAI Realtime) ──────────────────────
    async function startVoiceSession(r) {
      stopSpeaking();
      const btnTalk   = document.getElementById('btn-talk');
      const panel     = document.getElementById('voice-panel');
      btnTalk.disabled    = true;
      btnTalk.textContent = 'Connecting...';

      try {
        const steps = (r.action_plan ?? []).map((s, i) => (i + 1) + '. ' + s.action).join('\n');
        const warns = (r.safety_warnings ?? []).join(', ');
        const systemPrompt =
          'You are an expert plumbing diagnostic assistant on a voice call with a field plumber. ' +
          'You already analyzed their video and provided this diagnosis:\n\n' +
          'Diagnosis: ' + r.diagnosis + '\n' +
          'Likely cause: ' + r.likely_cause + '\n' +
          'Action plan:\n' + steps + '\n' +
          (warns ? 'Safety warnings: ' + warns + '\n' : '') +
          (r.notes ? 'Notes: ' + r.notes + '\n' : '') +
          '\nAnswer follow-up questions concisely and practically. ' +
          'Keep responses brief and actionable — the plumber is on a job site.';

        const tokenRes = await fetch('/api/realtime-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ systemPrompt })
        });
        if (!tokenRes.ok) throw new Error('Session request failed (' + tokenRes.status + ')');
        const sessionData  = await tokenRes.json();
        const ephemeralKey = sessionData.client_secret?.value;
        if (!ephemeralKey) throw new Error('No ephemeral key in response');

        voicePc = new RTCPeerConnection();

        const audioEl = document.getElementById('voice-audio');
        voicePc.ontrack = e => { audioEl.srcObject = e.streams[0]; };

        voiceMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        voiceMicStream.getTracks().forEach(t => voicePc.addTrack(t, voiceMicStream));

        const dc = voicePc.createDataChannel('oai-events');
        dc.onmessage = e => {
          try {
            const evt = JSON.parse(e.data);
            if (evt.type === 'response.audio.delta')             setVoiceState('speaking');
            else if (evt.type === 'response.done')               setVoiceState('listening');
            else if (evt.type === 'input_audio_buffer.speech_started') setVoiceState('listening');
          } catch (_) {}
        };

        const offer = await voicePc.createOffer();
        await voicePc.setLocalDescription(offer);

        const sdpRes = await fetch('https://api.openai.com/v1/realtime?model=gpt-4o-realtime-preview-2024-12-17', {
          method: 'POST',
          body: offer.sdp,
          headers: { Authorization: 'Bearer ' + ephemeralKey, 'Content-Type': 'application/sdp' }
        });
        if (!sdpRes.ok) throw new Error('WebRTC SDP exchange failed (' + sdpRes.status + ')');

        await voicePc.setRemoteDescription({ type: 'answer', sdp: await sdpRes.text() });

        btnTalk.classList.add('hidden');
        btnTalk.disabled    = false;
        btnTalk.textContent = 'Talk with AI plumber →';
        panel.classList.remove('hidden');
        setVoiceState('listening');

      } catch (err) {
        console.error('[voice]', err);
        btnTalk.disabled    = false;
        btnTalk.textContent = 'Talk with AI plumber →';
        endVoiceSession();
      }
    }

    function setVoiceState(state) {
      const dot   = document.getElementById('voice-dot');
      const label = document.getElementById('voice-label');
      dot.className = 'voice-dot ' + state;
      if (state === 'listening') label.textContent = 'Listening — ask your question';
      else if (state === 'speaking') label.textContent = 'AI is speaking...';
      else label.textContent = 'Connecting...';
    }

    function endVoiceSession() {
      if (voiceMicStream) { voiceMicStream.getTracks().forEach(t => t.stop()); voiceMicStream = null; }
      if (voicePc)        { voicePc.close(); voicePc = null; }
      const audioEl = document.getElementById('voice-audio');
      if (audioEl) audioEl.srcObject = null;
      document.getElementById('voice-panel')?.classList.add('hidden');
      const btn = document.getElementById('btn-talk');
      if (btn) { btn.classList.remove('hidden'); btn.disabled = false; btn.textContent = 'Talk with AI plumber →'; }
    }

    // ── Save diagnosis (silent, non-blocking) ─────────────────────
    async function saveDiagnosis(r, firstFrameB64) {
      try {
        if (!_userId || !firstFrameB64) return;
        const diagId = crypto.randomUUID();
        const byteChars = atob(firstFrameB64);
        const byteNums  = new Array(byteChars.length).fill(0).map((_, i) => byteChars.charCodeAt(i));
        const blob = new Blob([new Uint8Array(byteNums)], { type: 'image/jpeg' });
        const path = _userId + '/' + diagId + '.jpg';
        await _supabase.storage.from('frames').upload(path, blob, { contentType: 'image/jpeg' });
        const { data: { publicUrl } } = _supabase.storage.from('frames').getPublicUrl(path);
        await _supabase.from('diagnoses').insert({
          id: diagId,
          user_id: _userId,
          frame_url: publicUrl,
          diagnosis:       r.diagnosis,
          likely_cause:    r.likely_cause,
          action_plan:     r.action_plan,
          safety_warnings: r.safety_warnings,
          confidence:      r.confidence,
          notes:           r.notes
        });
      } catch (err) {
        console.error('[saveDiagnosis] failed:', err.message, err);
      }
    }
  </script>
</body>
