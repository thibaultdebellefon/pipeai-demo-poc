<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0f1e">
  <title>PipeAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0f1e;
      --surface: #111827;
      --border:  #1f2937;
      --accent:  #f97316;
      --text:    #f1f5f9;
      --muted:   #94a3b8;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow: hidden;
    }

    /* ── State visibility ─────────────────────────────────── */
    .state { display: none; }
    .state.active { display: flex; }

    /* ── IDLE ─────────────────────────────────────────────── */
    #state-idle {
      min-height: 100dvh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 32px 24px;
      text-align: center;
    }

    #state-idle h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.03em; }
    #state-idle .sub {
      font-size: 0.95rem; color: var(--muted);
      line-height: 1.6; max-width: 320px;
    }

    /* ── CONNECTING ───────────────────────────────────────── */
    #state-connecting {
      min-height: 100dvh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .spinner {
      width: 48px; height: 48px;
      border: 4px solid var(--surface);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── ACTIVE ───────────────────────────────────────────── */
    #state-active {
      position: fixed; inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: max(48px, env(safe-area-inset-top)) 24px
               max(32px, env(safe-area-inset-bottom)) 24px;
      background: var(--bg);
    }

    /* Camera PiP — bottom-right corner */
    #camera-preview {
      position: fixed;
      bottom: max(100px, calc(env(safe-area-inset-bottom) + 88px));
      right: 16px;
      width: 96px; height: 128px;
      border-radius: 14px;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.15);
      z-index: 20;
      background: #000;
    }

    /* AI orb */
    .orb-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    #ai-orb {
      width: 140px; height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #818cf8, #1d4ed8 60%, #0f172a);
      box-shadow: 0 0 50px rgba(99,102,241,0.35), 0 0 100px rgba(99,102,241,0.15);
    }

    #ai-orb.speaking {
      animation: orb-speak 0.6s ease-in-out infinite alternate;
    }
    #ai-orb.listening {
      animation: orb-breathe 3s ease-in-out infinite;
    }
    #ai-orb.connecting {
      animation: orb-breathe 1.5s ease-in-out infinite;
      opacity: 0.6;
    }

    @keyframes orb-speak {
      from { transform: scale(1);    box-shadow: 0 0 50px rgba(99,102,241,0.4); }
      to   { transform: scale(1.18); box-shadow: 0 0 80px rgba(99,102,241,0.7); }
    }
    @keyframes orb-breathe {
      0%,100% { transform: scale(1); }
      50%     { transform: scale(1.06); }
    }

    #status-label {
      font-size: 1rem; color: var(--muted);
      min-height: 1.4em; text-align: center;
    }

    /* ── Buttons ─────────────────────────────────────────── */
    .btn {
      width: 100%; max-width: 360px;
      min-height: 56px; padding: 18px;
      border: none; border-radius: 16px;
      font-size: 1rem; font-weight: 600;
      cursor: pointer; touch-action: manipulation;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:active   { opacity: 0.75; }
    .btn-primary  { background: var(--accent); color: #fff; }
    .btn-danger   { background: #ef4444; color: #fff; }
    .btn-secondary { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }

    /* ── ERROR ────────────────────────────────────────────── */
    #state-error {
      min-height: 100dvh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 32px 24px;
    }

    .error-box {
      background: #1c0a0a; border: 1px solid #7f1d1d;
      border-radius: 12px; padding: 20px; text-align: center;
      max-width: 360px; width: 100%;
    }
    #error-message { color: #fca5a5; font-size: 0.95rem; line-height: 1.5; word-break: break-word; }
  </style>
</head>
<body style="visibility:hidden">

  <!-- IDLE -->
  <div id="state-idle" class="state active">
    <h1>PipeAI</h1>
    <p class="sub">Point your camera at the plumbing problem and start talking. The AI sees and hears everything in real time.</p>
    <button id="btn-start" class="btn btn-primary">Start consultation →</button>
    <a href="account.html" class="btn btn-secondary" style="text-align:center;text-decoration:none;">Profile →</a>
  </div>

  <!-- CONNECTING -->
  <div id="state-connecting" class="state">
    <div class="spinner"></div>
    <p id="connect-step" style="color:var(--muted);font-size:0.9rem;">Starting...</p>
  </div>

  <!-- ACTIVE -->
  <div id="state-active" class="state">
    <video id="camera-preview" autoplay muted playsinline></video>
    <div class="orb-wrap">
      <div id="ai-orb" class="connecting"></div>
      <div id="status-label">Connecting...</div>
    </div>
    <button id="btn-end" class="btn btn-danger">End session</button>
  </div>

  <!-- ERROR -->
  <div id="state-error" class="state">
    <div class="error-box">
      <div id="error-message"></div>
    </div>
    <button id="btn-retry" class="btn btn-primary">Try again</button>
  </div>

  <script>
    // ── Auth guard ─────────────────────────────────────────────────
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    (async () => {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      document.body.style.visibility = 'visible';
    })();

    // ── State machine ──────────────────────────────────────────────
    const STATES = ['idle', 'connecting', 'active', 'error'];
    function setState(name) {
      STATES.forEach(s =>
        document.getElementById('state-' + s).classList.toggle('active', s === name)
      );
    }

    function showError(msg) {
      document.getElementById('error-message').textContent = msg;
      setState('error');
    }

    // ── Wire buttons ───────────────────────────────────────────────
    document.getElementById('btn-start').addEventListener('click', startSession);
    document.getElementById('btn-end').addEventListener('click', endSession);
    document.getElementById('btn-retry').addEventListener('click', () => setState('idle'));

    // ── Session state ──────────────────────────────────────────────
    let mediaStream    = null;
    let audioCtxIn     = null;   // 16 kHz AudioContext for mic input
    let audioCtxOut    = null;   // 24 kHz AudioContext for AI output
    let workletNode    = null;
    let ws             = null;
    let frameInterval  = null;
    let audioQueue     = [];
    let isPlaying      = false;
    let currentSource  = null;

    // ── System prompt ──────────────────────────────────────────────
    const SYSTEM_PROMPT =
      'You are a master plumber with 25+ years of field experience in residential and commercial plumbing, ' +
      'specialising in European and French installations (DTU regulations, NF standards). ' +
      'You are on a live video call with a plumber who is showing you their problem. ' +
      'You can see their camera feed and hear them speak. ' +
      'When the session starts, greet them briefly (one sentence) and ask them to show or describe the problem. ' +
      'As you watch the video, proactively name what you see — pipe material, joint type, visible damage — without waiting to be asked. ' +
      'Your tone is direct, practical, and collegial — a trusted senior colleague on the job site, not a manual or a chatbot. ' +
      'Use plain language. Be concise. Name parts and tools specifically (e.g. "22 mm spanner", "PTFE tape"). ' +
      'If you spot anything dangerous — water near electrics, gas smell, suspected asbestos — say so immediately and clearly. ' +
      'If a repair is beyond DIY scope, say so and recommend a specialist.';

    // ── Start session ──────────────────────────────────────────────
    function setStep(text) {
      const el = document.getElementById('connect-step');
      if (el) el.textContent = text;
    }

    async function startSession() {
      setState('connecting');
      try {
        setStep('1/4 Camera access...');
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });
        document.getElementById('camera-preview').srcObject = mediaStream;

        setStep('2/4 Fetching key...');
        const keyRes = await fetch('/api/gemini-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        if (!keyRes.ok) throw new Error('Server error ' + keyRes.status + ' — check GEMINI_API_KEY on Vercel');
        const { apiKey } = await keyRes.json();
        if (!apiKey) throw new Error('No API key returned from server');

        setStep('3/4 Connecting to Gemini...');
        await connectGemini(apiKey);

        setStep('4/4 Setting up audio...');
        await setupAudioCapture();

        startFrameCapture();
        setState('active');
        setOrbState('listening');
        setStatus('Listening...');

      } catch (err) {
        cleanup();
        const msg =
          err.name === 'NotAllowedError'
            ? 'Camera and microphone access required. Allow access in browser settings, then try again.'
            : err.message || 'Connection failed. Check your network and try again.';
        showError(msg);
      }
    }

    // ── Connect to Gemini Live ─────────────────────────────────────
    function connectGemini(apiKey) {
      return new Promise((resolve, reject) => {
        const url =
          'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.' +
          'GenerativeService.BidiGenerateContent?key=' + apiKey;

        ws = new WebSocket(url);

        // 10-second timeout for setup
        const setupTimeout = setTimeout(() => {
          ws.onclose = null;
          ws.close();
          reject(new Error('Connection timed out. Check your network and try again.'));
        }, 10000);

        ws.onopen = () => {
          ws.send(JSON.stringify({
            setup: {
              model: 'models/gemini-2.0-flash',
              generationConfig: {
                responseModalities: ['AUDIO'],
                speechConfig: {
                  voiceConfig: {
                    prebuiltVoiceConfig: { voiceName: 'Puck' }
                  }
                }
              },
              systemInstruction: {
                parts: [{ text: SYSTEM_PROMPT }]
              }
            }
          }));
        };

        ws.onmessage = (e) => {
          let msg;
          try { msg = JSON.parse(e.data); } catch (_) { return; }

          if (msg.setupComplete) {
            clearTimeout(setupTimeout);
            resolve();
            return;
          }
          // Surface Gemini API errors (bad key, quota, wrong model, etc.)
          if (msg.error) {
            clearTimeout(setupTimeout);
            ws.onclose = null;
            reject(new Error('Gemini error ' + msg.error.code + ': ' + msg.error.message));
            return;
          }
          handleGeminiMessage(msg);
        };

        ws.onerror = () => {
          clearTimeout(setupTimeout);
          ws.onclose = null;
          reject(new Error('WebSocket failed — check network or API key'));
        };

        ws.onclose = (e) => {
          clearTimeout(setupTimeout);
          if (document.getElementById('state-active').classList.contains('active')) {
            cleanup();
            showError('Connection lost. Please try again.');
          } else {
            // Closed during setup — reject so catch block shows the error
            reject(new Error('Connection closed during setup (code ' + e.code + '). Check API key and try again.'));
          }
        };
      });
    }

    // ── Handle incoming Gemini messages ───────────────────────────
    function handleGeminiMessage(msg) {
      const content = msg.serverContent;
      if (!content) return;

      if (content.interrupted) {
        stopAudioPlayback();
        setOrbState('listening');
        setStatus('Listening...');
        return;
      }

      if (content.modelTurn?.parts) {
        for (const part of content.modelTurn.parts) {
          if (part.inlineData?.mimeType?.startsWith('audio/pcm') && part.inlineData.data) {
            queueAudio(part.inlineData.data);
            setOrbState('speaking');
            setStatus('AI is speaking...');
          }
        }
      }

      if (content.turnComplete) {
        setOrbState('listening');
        setStatus('Listening...');
      }
    }

    // ── Orb & status helpers ──────────────────────────────────────
    function setOrbState(state) {
      document.getElementById('ai-orb').className = state;
    }

    function setStatus(text) {
      document.getElementById('status-label').textContent = text;
    }

    // ── End session ────────────────────────────────────────────────
    function endSession() {
      cleanup();
      setState('idle');
    }

    function cleanup() {
      clearInterval(frameInterval); frameInterval = null;

      if (ws)          { ws.onclose = null; ws.close(); ws = null; }
      if (workletNode) { try { workletNode.disconnect(); } catch (_) {} workletNode = null; }
      if (audioCtxIn)  { audioCtxIn.close().catch(() => {}); audioCtxIn = null; }
      if (audioCtxOut) { audioCtxOut.close().catch(() => {}); audioCtxOut = null; }
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }

      audioQueue = [];
      isPlaying  = false;
      if (currentSource) { try { currentSource.stop(); } catch (_) {} currentSource = null; }
    }

    // ── Stubs for Tasks 4 & 5 (will be replaced) ─────────────────
    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let str = '';
      for (let i = 0; i < bytes.byteLength; i++) str += String.fromCharCode(bytes[i]);
      return btoa(str);
    }

    async function setupAudioCapture() {
      // Use a static file instead of a Blob URL — iOS Safari hangs on addModule(blobUrl)
      audioCtxIn = new AudioContext({ sampleRate: 16000 });
      await audioCtxIn.resume();
      await audioCtxIn.audioWorklet.addModule('/pcm-processor.js');

      const source = audioCtxIn.createMediaStreamSource(mediaStream);
      workletNode  = new AudioWorkletNode(audioCtxIn, 'pcm-processor');

      workletNode.port.onmessage = (e) => {
        if (ws?.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            realtime_input: {
              media_chunks: [{
                mime_type: 'audio/pcm;rate=16000',
                data: arrayBufferToBase64(e.data)
              }]
            }
          }));
        }
      };

      // Capture only — do NOT connect workletNode to destination (avoids echo)
      source.connect(workletNode);
    }

    function startFrameCapture() {
      const video  = document.getElementById('camera-preview');
      const canvas = document.createElement('canvas');
      const ctx    = canvas.getContext('2d');

      frameInterval = setInterval(() => {
        if (ws?.readyState !== WebSocket.OPEN) return;
        if (!video.videoWidth) return;

        const scale   = Math.min(1, 640 / Math.max(video.videoWidth, video.videoHeight));
        canvas.width  = Math.round(video.videoWidth  * scale);
        canvas.height = Math.round(video.videoHeight * scale);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        const base64  = dataUrl.slice(dataUrl.indexOf(',') + 1);

        ws.send(JSON.stringify({
          realtime_input: {
            media_chunks: [{
              mime_type: 'image/jpeg',
              data: base64
            }]
          }
        }));
      }, 1000); // 1 frame/s
    }

    function queueAudio(base64Data) {
      audioQueue.push(base64Data);
      if (!isPlaying) playNextAudio();
    }

    function playNextAudio() {
      if (audioQueue.length === 0) { isPlaying = false; return; }
      isPlaying = true;

      const base64  = audioQueue.shift();
      const binary  = atob(base64);
      const bytes   = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

      const int16   = new Int16Array(bytes.buffer);
      const float32 = new Float32Array(int16.length);
      for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768.0;

      if (!audioCtxOut) audioCtxOut = new AudioContext({ sampleRate: 24000 });

      const buffer  = audioCtxOut.createBuffer(1, float32.length, 24000);
      buffer.copyToChannel(float32, 0);

      currentSource = audioCtxOut.createBufferSource();
      currentSource.buffer = buffer;
      currentSource.connect(audioCtxOut.destination);
      currentSource.onended = () => { currentSource.buffer = null; currentSource = null; playNextAudio(); };
      currentSource.start();
    }

    function stopAudioPlayback() {
      audioQueue = [];
      isPlaying  = false;
      if (currentSource) {
        try { currentSource.stop(); } catch (_) {}
        currentSource = null;
      }
    }
  </script>
</body>
</html>
