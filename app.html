<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0f1e">
  <title>PipeAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0f1e;
      --surface: #111827;
      --border:  #1f2937;
      --accent:  #f97316;
      --text:    #f1f5f9;
      --muted:   #94a3b8;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow: hidden;
    }

    /* ── State visibility ─────────────────────────────────── */
    .state { display: none; }
    .state.active { display: flex; }

    /* ── IDLE ─────────────────────────────────────────────── */
    #state-idle {
      min-height: 100dvh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 32px 24px;
      text-align: center;
    }

    #state-idle h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.03em; }
    #state-idle .sub {
      font-size: 0.95rem; color: var(--muted);
      line-height: 1.6; max-width: 320px;
    }

    /* ── CONNECTING ───────────────────────────────────────── */
    #state-connecting {
      min-height: 100dvh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .spinner {
      width: 48px; height: 48px;
      border: 4px solid var(--surface);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── ACTIVE ───────────────────────────────────────────── */
    #state-active {
      position: fixed; inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: max(48px, env(safe-area-inset-top)) 24px
               max(32px, env(safe-area-inset-bottom)) 24px;
      background: var(--bg);
    }

    /* Camera PiP — bottom-right corner */
    #camera-preview {
      position: fixed;
      bottom: max(100px, calc(env(safe-area-inset-bottom) + 88px));
      right: 16px;
      width: 96px; height: 128px;
      border-radius: 14px;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.15);
      z-index: 20;
      background: #000;
    }

    /* AI orb */
    .orb-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    #ai-orb {
      width: 140px; height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #818cf8, #1d4ed8 60%, #0f172a);
      box-shadow: 0 0 50px rgba(99,102,241,0.35), 0 0 100px rgba(99,102,241,0.15);
    }

    #ai-orb.speaking {
      animation: orb-speak 0.6s ease-in-out infinite alternate;
    }
    #ai-orb.listening {
      animation: orb-breathe 3s ease-in-out infinite;
    }
    #ai-orb.connecting {
      animation: orb-breathe 1.5s ease-in-out infinite;
      opacity: 0.6;
    }

    @keyframes orb-speak {
      from { transform: scale(1);    box-shadow: 0 0 50px rgba(99,102,241,0.4); }
      to   { transform: scale(1.18); box-shadow: 0 0 80px rgba(99,102,241,0.7); }
    }
    @keyframes orb-breathe {
      0%,100% { transform: scale(1); }
      50%     { transform: scale(1.06); }
    }

    #status-label {
      font-size: 1rem; color: var(--muted);
      min-height: 1.4em; text-align: center;
    }

    /* ── Buttons ─────────────────────────────────────────── */
    .btn {
      width: 100%; max-width: 360px;
      min-height: 56px; padding: 18px;
      border: none; border-radius: 16px;
      font-size: 1rem; font-weight: 600;
      cursor: pointer; touch-action: manipulation;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:active   { opacity: 0.75; }
    .btn-primary  { background: var(--accent); color: #fff; }
    .btn-danger   { background: #ef4444; color: #fff; }
    .btn-secondary { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }

    /* ── ERROR ────────────────────────────────────────────── */
    #state-error {
      min-height: 100dvh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 32px 24px;
    }

    .error-box {
      background: #1c0a0a; border: 1px solid #7f1d1d;
      border-radius: 12px; padding: 20px; text-align: center;
      max-width: 360px; width: 100%;
    }
    #error-message { color: #fca5a5; font-size: 0.95rem; line-height: 1.5; }
  </style>
</head>
<body style="visibility:hidden">

  <!-- IDLE -->
  <div id="state-idle" class="state active">
    <h1>PipeAI</h1>
    <p class="sub">Point your camera at the plumbing problem and start talking. The AI sees and hears everything in real time.</p>
    <button id="btn-start" class="btn btn-primary">Start consultation →</button>
    <a href="account.html" class="btn btn-secondary" style="text-align:center;text-decoration:none;">Profile →</a>
  </div>

  <!-- CONNECTING -->
  <div id="state-connecting" class="state">
    <div class="spinner"></div>
    <p style="color:var(--muted);font-size:0.9rem;">Connecting...</p>
  </div>

  <!-- ACTIVE -->
  <div id="state-active" class="state">
    <video id="camera-preview" autoplay muted playsinline></video>
    <div class="orb-wrap">
      <div id="ai-orb" class="connecting"></div>
      <div id="status-label">Connecting...</div>
    </div>
    <button id="btn-end" class="btn btn-danger">End session</button>
  </div>

  <!-- ERROR -->
  <div id="state-error" class="state">
    <div class="error-box">
      <div id="error-message"></div>
    </div>
    <button id="btn-retry" class="btn btn-primary">Try again</button>
  </div>

  <script>
    // ── Auth guard ─────────────────────────────────────────────────
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    (async () => {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      document.body.style.visibility = 'visible';
    })();

    // ── State machine ──────────────────────────────────────────────
    const STATES = ['idle', 'connecting', 'active', 'error'];
    function setState(name) {
      STATES.forEach(s =>
        document.getElementById('state-' + s).classList.toggle('active', s === name)
      );
    }

    function showError(msg) {
      document.getElementById('error-message').textContent = msg;
      setState('error');
    }

    // ── Wire buttons ───────────────────────────────────────────────
    document.getElementById('btn-start').addEventListener('click', startSession);
    document.getElementById('btn-end').addEventListener('click', endSession);
    document.getElementById('btn-retry').addEventListener('click', () => setState('idle'));

    // ── Session logic (implemented in Tasks 3–5) ───────────────────
    async function startSession() { setState('connecting'); /* TODO */ }
    function endSession() { setState('idle'); /* TODO */ }
  </script>
</body>
</html>
